# Vérifie le hub : types, compilation, tests (unitaires, intégration, e2e), puis l'image Docker réellement servie par nginx.
# Lancé sur chaque demande de fusion, et rappelé par images.yml avant de publier une image.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    name: Types, build, pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types et compilation
        run: npm run build
      - name: Pages générées (une par jeu, accueil, 404)
        run: scripts/verifier-dist.sh dist

  tests:
    name: Tests unitaires et intégration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Tests e2e (bureau + téléphone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Image Docker
    needs: [site, tests, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: games-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Servir l'image et tester de vraies requêtes
        run: scripts/tester-image.sh games-hub:ci
