# Fusion dans main : vérifications, puis construction et publication de l'image sur GHCR.
# Le Raspberry Pi (Watchtower, qui suit le tag « latest ») la déploie tout seul en quelques minutes.
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Publier l'image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Le Pi est en arm64, le poste de développement en amd64 : l'image sert les deux.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rxdy/games-hub:latest
            ghcr.io/rxdy/games-hub:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
