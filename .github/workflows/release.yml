# Un tag vX.Y.Z posé sur main (make release V=X.Y.Z) : on reprend l'image déjà construite pour ce commit,
# sans la reconstruire, on lui pose le tag de la version, et on crée la release GitHub avec le site compilé.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/rxdy/games-hub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Le tag est bien sur main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME n'est pas sur main : une version se pose sur ce qui est en production."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le tag est souvent posé juste après la fusion : l'image de main peut être encore en construction.
      - name: Attendre l'image de ce commit
        run: |
          for i in $(seq 1 40); do
            if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /dev/null 2>&1; then exit 0; fi
            echo "Image $GITHUB_SHA pas encore publiée ($i/40)..."; sleep 30
          done
          echo "::error::Aucune image pour $GITHUB_SHA. Ce commit n'est pas passé par images.yml : la release ne reconstruit jamais."
          exit 1

      - name: Poser le tag de version sur l'image
        run: docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:$GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Site compilé (archive jointe à la release)
        run: |
          npm ci
          npm run build
          tar czf "games-hub-$GITHUB_REF_NAME.tar.gz" -C dist .

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "games-hub-$GITHUB_REF_NAME.tar.gz" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
