server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /duck -> /duck/ en redirection relative : derrière Traefik, on ne connaît ni le schéma ni le port publics.
    absolute_redirect off;

    # /duck -> /duck/index.html (pages générées au build), sinon page 404
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404/index.html;

    # Les fichiers générés par Vite portent un hash dans leur nom : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Les pages HTML, elles, doivent toujours être revalidées.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Attention : un add_header dans un location remplace ceux du server. Les en-têtes de sécurité sont donc
    # répétés dans chaque location qui en définit un (vérifié par scripts/tester-image.sh).
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

}
